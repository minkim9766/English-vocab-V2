<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>영단어 암기 도우미</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <header>
    <h1>영단어 암기 도우미</h1>
  </header>

  <main>
    <section id="homeScreen" class="homeScreen">
      <div class="hero">
        <p class="eyebrow">MODE SELECT</p>
        <h2>모드 선택</h2>
        <p class="heroCopy">원하는 모드를 선택하세요.</p>
      </div>

      <div class="modeGrid">
        <button type="button" class="modeCard modeKo2En" data-mode="ko2en">
          <span class="modeIcon">한</span>
          <span class="modeTitle">한국어 → 영어</span>
          <span class="modeDesc">뜻을 보고 영어를 떠올리는 연습</span>
        </button>
        <button type="button" class="modeCard modeEn2Ko" data-mode="en2ko">
          <span class="modeIcon">A</span>
          <span class="modeTitle">영어 → 한국어</span>
          <span class="modeDesc">단어를 보고 한국어 뜻을 바로 찾기</span>
        </button>
        <button type="button" class="modeCard modeRandom" data-mode="random">
          <span class="modeIcon">?</span>
          <span class="modeTitle">랜덤</span>
          <span class="modeDesc">두 방향을 섞어서 실전처럼 훈련</span>
        </button>
      </div>

      <div class="quizCountPicker" aria-label="퀴즈 개수 선택">
        <div class="pickerLabel">퀴즈 개수</div>
        <div class="pickerButtons">
          <button type="button" class="quizCountBtn" data-count="10">10개</button>
          <button type="button" class="quizCountBtn" data-count="30">30개</button>
          <button type="button" class="quizCountBtn" data-count="50">50개</button>
          <button type="button" class="quizCountBtn" data-count="100">100개</button>
          <button type="button" class="quizCountBtn" data-count="200">200개</button>
          <button type="button" class="quizCountBtn selected" data-count="all">전부</button>
        </div>
      </div>
    </section>

    <section id="sessionArea" class="hidden">
      <div class="sessionTopBar">
        <div id="sessionLabel" class="sessionLabel"></div>
        <button type="button" id="exitBtn" class="ghostBtn">나가기</button>
      </div>

      <section id="flashArea" class="hidden">
        <div class="sectionTitle">플래시카드</div>
        <div class="miniActions">
          <button type="button" id="openQuizBtn" class="ghostBtn">퀴즈로 전환</button>
        </div>
        
        <!-- 통계 오버레이 창 -->
        <div class="flashTopStats">
          <div class="statBadge knownStat">
            <div class="statVal" id="flKnw">0</div>
            <div class="statLbl">외움</div>
          </div>
          <div class="statBadge unknownStat">
            <div class="statVal" id="flUnk">0</div>
            <div class="statLbl">못 외움</div>
          </div>
        </div>

      <div class="cardWrap">
        <div id="card" class="card" role="button" aria-label="플래시 카드 뒤집기" tabindex="0">
          <div class="cardInner">
            <div id="cardFront" class="side frontSide">
              <div class="textInner">카드를 시작하세요</div>
            </div>
            <div id="cardBack" class="side backSide">
              <div class="textInner"></div>
            </div>
          </div>
        </div>
        <div class="dragOverlay" aria-hidden="true">
          <div class="dragLabel left">외움</div>
          <div class="dragLabel right">못 외움</div>
          <div class="dragLabel down">넘기기</div>
          <div class="dragDivider"></div>
        </div>
      </div>
      <div class="cardButtons">
        <button type="button" id="knowBtn">외웠다</button>
        <button type="button" id="dontKnowBtn">외우지 못함</button>
        <button type="button" id="skipBtn">넘기기</button>
      </div>
      </section>

      <!-- 플래시 카드 결과 창 -->
      <section id="flashResultArea" class="hidden resultArea">
        <div class="resultBox">
          <div style="font-size: 3rem; margin-bottom:10px;">🎉</div>
          <h2>플래시카드 완료!</h2>
          <div class="flashResultStats"></div>
          <div class="resultActions">
            <button type="button" id="retryUnknownBtn" class="accentBtn">못 외운 단어 다시 학습</button>
            <button type="button" id="retryAllFlashBtn" class="ghostBtn">처음부터 다시</button>
            <button type="button" id="fromFlashToQuizBtn" class="ghostBtn">퀴즈로 확인하기</button>
          </div>
        </div>
      </section>

      <section id="quizArea" class="hidden">
        <div class="sectionTitle">퀴즈</div>
        <div class="miniActions">
          <button type="button" id="openFlashBtn" class="ghostBtn">플래시카드로 전환</button>
        </div>
        <div class="flashTopStats quizTopStats">
          <div class="statBadge knownStat">
            <div class="statVal" id="qCorrect">0</div>
            <div class="statLbl">맞음</div>
          </div>
          <div class="statBadge unknownStat">
            <div class="statVal" id="qWrong">0</div>
            <div class="statLbl">틀림</div>
          </div>
        </div>
        <div id="quizPrompt" class="prompt"></div>
        <input id="quizInput" placeholder="정답을 입력하세요" autocomplete="off"/>
        <div class="quizButtons">
          <button type="button" id="submitAnswer">제출</button>
          <button type="button" id="nextQuiz">다음</button>
        </div>
        <div id="quizFeedback"></div>
      </section>

      <!-- 퀴즈 결과 창 -->
      <section id="quizResultArea" class="hidden resultArea">
        <div class="resultBox">
          <div id="quizResultEmoji" style="font-size: 3rem; margin-bottom:10px;">🏆</div>
          <h2>퀴즈 완료!</h2>
          <div id="quizScoreText" class="scoreText"></div>
          <div class="resultActions">
            <button type="button" id="reviewWrongBtn" class="accentBtn hidden">틀린 문제 플래시카드로 복습</button>
            <button type="button" id="retryAllQuizBtn" class="ghostBtn">퀴즈 처음부터 다시</button>
            <button type="button" id="quizToHomeBtn" class="ghostBtn">홈으로</button>
          </div>
        </div>
      </section>
    </section>

    <!-- statsRow (하단)은 이제 숨기거나 제거. 세션 통계로 대체 -->
  </main>

  <div id="toastHost" class="toastHost" aria-live="polite"></div>

  <script src="script.js?v=7"></script>
</body>
</html>
